<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__ · WeMD-AI 预览</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0d0d10;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:32px 16px 48px;font-family:-apple-system,'PingFang SC',sans-serif;-webkit-font-smoothing:antialiased}
  .header{text-align:center;margin-bottom:28px}
  .header h1{font-size:15px;font-weight:700;letter-spacing:2px;color:#e4e4e7}
  .header h1 span{color:#f43f5e}
  .header p{font-size:11px;color:#6b6b75;margin-top:4px}

  .phone-frame{width:390px;background:#fff;border-radius:44px;overflow:hidden;box-shadow:0 0 0 1px #2a2a2d,0 0 0 3px #0d0d0f,0 0 0 4px #3a3a3e,0 0 0 5px #0d0d0f,0 20px 60px rgba(0,0,0,.5);position:relative}
  .phone-frame .statusbar{padding:12px 22px 6px;font-size:10.5px;font-weight:600;color:#1a1a1a;display:flex;justify-content:space-between;font-family:-apple-system,sans-serif;background:#fff}
  .phone-frame .content{min-height:400px;max-height:640px;overflow-y:auto;overflow-x:hidden;background:#fff}
  .phone-frame .content::-webkit-scrollbar{width:3px}
  .phone-frame .content::-webkit-scrollbar-thumb{background:rgba(0,0,0,.08);border-radius:2px}
  .phone-frame .homebar{height:20px;display:flex;align-items:center;justify-content:center;background:#fff}
  .phone-frame .homebar::after{content:'';width:134px;height:4px;background:#1a1a1a;border-radius:2px;opacity:.12}

  .copy-row{margin-top:24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  .copy-btn{padding:11px 32px;border:none;border-radius:8px;background:#f43f5e;color:#fff;font-size:14px;font-weight:600;font-family:inherit;letter-spacing:1px;cursor:pointer;box-shadow:0 3px 14px rgba(244,63,94,.3);transition:all .2s ease}
  .copy-btn:hover{background:#e11d48;box-shadow:0 5px 20px rgba(244,63,94,.45);transform:translateY(-1px)}
  .copy-btn:active{transform:translateY(0)}
  .copy-status{font-size:11px;color:#22c55e;letter-spacing:.3px;transition:all .3s}
  .edit-btn{padding:11px 22px;border:1px solid #2a2a2d;border-radius:8px;background:transparent;color:#84848c;font-size:13px;font-weight:500;font-family:inherit;letter-spacing:.3px;cursor:pointer;transition:all .2s ease}
  .edit-btn:hover{border-color:#6366f1;color:#818cf8;background:rgba(99,102,241,.06)}

  .dark-toggle{padding:6px 12px;border:1px solid #222228;border-radius:5px;background:transparent;color:#6b6b75;font-size:12px;font-family:inherit;cursor:pointer}
  .dark-toggle.active{color:#fbbf24;border-color:#fbbf24}
  .screen.dark{background:#191919}

  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(12px);padding:10px 26px;background:#1f1f28;color:#fff;font-size:13px;letter-spacing:.3px;border-radius:8px;border:1px solid #222228;box-shadow:0 10px 32px rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:all .28s ease;z-index:100}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(max-width:440px){.phone-frame{width:100%;border-radius:0;box-shadow:none;border:1px solid #2a2a2d}}
</style>
</head>
<body>

<div class="header">
  <h1>We<span>MD</span>-AI 排版预览</h1>
  <p>__TITLE__</p>
</div>

<div class="phone-frame">
  <div class="statusbar"><span id="timeLabel">9:41</span><span>▮▮▮▮ ⋮⋮⋮⋮</span></div>
  <div class="content" id="content">
    __CONTENT__
  </div>
  <div class="homebar"></div>
</div>

<div class="copy-row">
  <button class="copy-btn" onclick="copyToWechat()">📋 复制到公众号</button>
  <button class="edit-btn" onclick="openEditor()">✏️ 修改排版</button>
  <button class="dark-toggle" id="btnDark">🌙 暗色</button>
  <span class="copy-status" id="copyStatus"></span>
</div>

<div class="toast" id="toast"></div>

<script>
document.getElementById('btnDark').addEventListener('click',function(){
  var s = document.querySelector('.phone-frame .content');
  s.classList.toggle('dark');
  this.classList.toggle('active');
  this.textContent = s.classList.contains('dark') ? '☀️ 白天' : '🌙 暗色';
});

function copyToWechat(){
  var h = document.getElementById('content').innerHTML;
  var hidden = document.createElement('div');
  hidden.contentEditable = true;
  hidden.style.cssText = 'position:fixed;left:-9999px;top:0;width:390px;';
  hidden.innerHTML = h;
  document.body.appendChild(hidden);
  var r = document.createRange(); r.selectNodeContents(hidden);
  var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  function ok(){document.getElementById('copyStatus').textContent='✓ 已复制';showToast('已复制！公众号后台 Ctrl+V 粘贴');setTimeout(function(){document.getElementById('copyStatus').textContent='';},3000)}
  try{document.execCommand('copy');s.removeAllRanges();document.body.removeChild(hidden);ok()}
  catch(e){s.removeAllRanges();document.body.removeChild(hidden);navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([h],{type:'text/html'})})]).then(ok,function(){showToast('复制失败')})}
}

function openEditor(){
  var h = document.getElementById('content').innerHTML;
  window.name = 'WeMD_EDIT:' + encodeURIComponent(h);
  // 自动判断路径：output/ 下跳上级，其余跳同级
  var url = window.location.href;
  var p = (url.indexOf('/output/') > -1 || url.indexOf('\\output\\') > -1)
    ? '../preview.html' : 'preview.html';
  window.location.href = p;
}

function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2500)}
var d=new Date();document.getElementById('timeLabel').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
</script>
</body>
</html>
